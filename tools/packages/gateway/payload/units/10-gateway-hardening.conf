# 10-gateway-hardening.conf — concurrency-proxy 双实例通用硬化 drop-in（部署面模板）
# 落位（B6 通用化——v2/vl 双实例同件）：
#   /etc/systemd/system/concurrency-proxy-v2.service.d/10-gateway-hardening.conf
#   /etc/systemd/system/concurrency-proxy-vl.service.d/10-gateway-hardening.conf
# 律：drop-in 只加不改（主 unit 键面零覆盖冲突）；部署后 systemctl daemon-reload +
#     restart 归部署窗动作（本包案头零 systemd 操作）。
[Service]
# 观测面：journal 标签+持久化（proxy 自带 /gw/metrics 计数器，journal 为第二通道）
StandardOutput=journal
StandardError=journal
# 资源面：网关=轻量 asyncio 件，限面防失控（OOM 前科族防御位，值=部署窗可调）
MemoryMax=2G
# 安全面：非特权+最小权限（无写面需求；只读 home）
NoNewPrivileges=true
ProtectSystem=strict
ReadWritePaths=/opt/aicad-prod/scripts
PrivateTmp=true
